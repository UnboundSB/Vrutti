<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vrutti IDE</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background-color: #0f111a;
      }
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        border: 2px solid #0f111a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      window.vruttiIpcMessage = function(b64) {
          try {
              const str = atob(b64);
              const msg = JSON.parse(str);
              
              // Dispatch a global event for any Lit component to consume
              window.dispatchEvent(new CustomEvent('vrutti-ipc', { detail: msg }));
              
              if (msg.method === 'theme/apply') {
                  const colors = msg.params.colors;
                  const root = document.documentElement;
                  
                  // Map VS Code theme tokens to Vrutti CSS variables
                  const mapping = {
                      'editor.background': '--vrutti-bg',
                      'sideBar.background': '--vrutti-surface',
                      'activityBar.background': '--vrutti-surface',
                      'editorGroupHeader.tabsBackground': '--vrutti-surface',
                      'editor.foreground': '--vrutti-text-bright',
                      'sideBarTitle.foreground': '--vrutti-text',
                      'tab.activeBackground': '--vrutti-surface-border',
                      'button.background': '--vrutti-accent',
                      'focusBorder': '--vrutti-accent',
                      'editorLineNumber.foreground': '--vrutti-text',
                      'terminal.background': '--vrutti-bg'
                  };
                  
                  for (const [vsc, vrv] of Object.entries(mapping)) {
                      // Some themes use #RRGGBBAA. We could parse it, but standard hex is fine.
                      if (colors[vsc]) {
                          root.style.setProperty(vrv, colors[vsc]);
                      }
                  }
                  
                  // Update HTML body background
                  if (colors['editor.background']) {
                      document.body.style.backgroundColor = colors['editor.background'];
                  }
                  
                  console.log(`[Theme] Applied ${msg.params.name}`);
              }
          } catch(e) {
              console.error("IPC Message Error:", e);
          }
      };
    </script>
    <vrutti-app></vrutti-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
