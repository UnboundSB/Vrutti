<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vrutti IDE</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background-color: var(--vrutti-bg, #0f111a);
      }
      :root {
        --vrutti-bg: hsl(230, 25%, 8%);
        --vrutti-surface: hsla(230, 25%, 15%, 0.6);
        --vrutti-surface-border: hsla(230, 25%, 25%, 0.4);
        --vrutti-accent: hsl(210, 100%, 75%);
        --vrutti-text: hsl(220, 25%, 75%);
        --vrutti-text-bright: hsl(220, 25%, 95%);
      }
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        border: 2px solid #0f111a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      body.glass-mode {
        background: var(--vrutti-glass-bg, transparent);
        backdrop-filter: var(--vrutti-backdrop-filter, blur(20px));
        -webkit-backdrop-filter: var(--vrutti-backdrop-filter, blur(20px));
      }
    </style>
  </head>
  <body>
    <script>
      // Theme loading is now handled strictly by ThemeBridge.ts
      // We no longer rely on index.html for theme state management.

      window.vruttiIpcMessage = function(b64) {
          try {
              const str = atob(b64);
              const lines = str.split('\\n');
              for (const line of lines) {
                  if (!line.trim()) continue;
                  try {
                      const msg = JSON.parse(line);
                      
                      // Dispatch a global event for any Lit component to consume
                      window.dispatchEvent(new CustomEvent('vrutti-ipc', { detail: msg }));
                      
                      if (msg.method === 'theme/load') {
                          // Handled globally via event dispatcher in ThemeBridge.ts
                      }
                  } catch (e) {
                      console.error("Failed to parse individual IPC message:", e);
                  }
              }
          } catch(e) {
              console.error("IPC Base64/Dispatch Error:", e);
          }
      };
    </script>
    <vrutti-app></vrutti-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
