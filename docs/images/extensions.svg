<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" font-family="'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>How an extension reaches the native core</title>
  <desc>A VSIX extension runs in a real Node.js extension host against the real vscode API. Calls travel over a named pipe to the native C++ core, which answers over the same pipe.</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b4261"/>
      <stop offset="45%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23273b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7"/>
    </marker>
    <marker id="aPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f7768e"/>
    </marker>
    <marker id="aDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#565f89"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1040" height="540" rx="18" fill="#16161e"/>
  <rect x="0.75" y="0.75" width="1038.5" height="538.5" rx="17.25" fill="none" stroke="#292e42" stroke-width="1.5"/>

  <!-- header -->
  <g>
    <rect x="34" y="26" width="34" height="34" rx="9" fill="url(#brand)"/>
    <path d="M51 32 L58 40 L51 48 L44 40 Z" fill="#16161e" opacity="0.85"/>
    <path d="M51 48 L51 55" stroke="#16161e" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <text x="80" y="50" fill="#c0caf5" font-size="21" font-weight="700">Vrutti IDE</text>
    <text x="196" y="50" fill="#565f89" font-size="15">the extension bridge</text>
    <line x1="34" y1="78" x2="1006" y2="78" stroke="#292e42" stroke-width="1.5"/>
  </g>

  <!-- ============ column 1: the extension ============ -->
  <g>
    <rect x="34" y="104" width="268" height="286" rx="14" fill="url(#card)" stroke="#3b4261" stroke-width="1.5"/>
    <rect x="34" y="104" width="268" height="4" rx="2" fill="#9ece6a"/>
    <text x="56" y="138" fill="#c0caf5" font-size="16" font-weight="700">The extension</text>
    <text x="56" y="158" fill="#565f89" font-size="12" font-family="Consolas, monospace">a .vsix, unmodified</text>

    <!-- extension chips -->
    <g font-size="12.5" fill="#a9b1d6">
      <rect x="56" y="176" width="104" height="28" rx="7" fill="#1f2335" stroke="#3b4261"/>
      <circle cx="72" cy="190" r="4" fill="#9ece6a"/>
      <text x="84" y="194">GitLens</text>

      <rect x="168" y="176" width="112" height="28" rx="7" fill="#1f2335" stroke="#3b4261"/>
      <circle cx="184" cy="190" r="4" fill="#7aa2f7"/>
      <text x="196" y="194">ESLint</text>

      <rect x="56" y="212" width="118" height="28" rx="7" fill="#1f2335" stroke="#3b4261"/>
      <circle cx="72" cy="226" r="4" fill="#e0af68"/>
      <text x="84" y="230">Python</text>

      <rect x="182" y="212" width="98" height="28" rx="7" fill="#1f2335" stroke="#3b4261"/>
      <circle cx="198" cy="226" r="4" fill="#f7768e"/>
      <text x="210" y="230">Prettier</text>
    </g>

    <line x1="56" y1="260" x2="280" y2="260" stroke="#292e42" stroke-width="1"/>

    <g font-size="13" fill="#a9b1d6">
      <text x="56" y="286">Written against the</text>
      <text x="56" y="306" fill="#c0caf5" font-family="Consolas, monospace" font-size="12.5">vscode</text>
      <text x="104" y="306" fill="#a9b1d6">API only.</text>
    </g>
    <g font-size="12.5" fill="#565f89">
      <text x="56" y="334">No Vrutti-specific build.</text>
      <text x="56" y="352">No patched manifest.</text>
      <text x="56" y="370">No shim to outgrow.</text>
    </g>
  </g>

  <!-- ============ column 2: the extension host ============ -->
  <g>
    <rect x="386" y="104" width="268" height="286" rx="14" fill="url(#card)" stroke="#3b4261" stroke-width="1.5"/>
    <rect x="386" y="104" width="268" height="4" rx="2" fill="url(#brand)"/>
    <text x="408" y="138" fill="#c0caf5" font-size="16" font-weight="700">Extension host</text>
    <text x="408" y="158" fill="#565f89" font-size="12" font-family="Consolas, monospace">Node.js, one process</text>

    <rect x="408" y="176" width="224" height="42" rx="9" fill="#1f2335" stroke="#bb9af7" stroke-width="1.4"/>
    <text x="424" y="202" fill="#bb9af7" font-size="13" font-family="Consolas, monospace">the full vscode API</text>

    <g font-size="13" fill="#a9b1d6">
      <text x="408" y="246">• activation on demand</text>
      <text x="408" y="270">• real promises and events</text>
      <text x="408" y="294">• one process per window</text>
      <text x="408" y="318">• crashes stay isolated</text>
    </g>

    <rect x="408" y="334" width="224" height="38" rx="9" fill="#202233" stroke="#3b4261" stroke-width="1.2"/>
    <text x="424" y="357" fill="#9ece6a" font-size="12">the same API the reference editor ships</text>
  </g>

  <!-- ============ column 3: the native core ============ -->
  <g>
    <rect x="738" y="104" width="268" height="286" rx="14" fill="url(#card)" stroke="#3b4261" stroke-width="1.5"/>
    <rect x="738" y="104" width="268" height="4" rx="2" fill="#f7768e"/>
    <text x="760" y="138" fill="#c0caf5" font-size="16" font-weight="700">Native core</text>
    <text x="760" y="158" fill="#565f89" font-size="12" font-family="Consolas, monospace">C++, one process</text>

    <g font-size="13" fill="#a9b1d6">
      <text x="760" y="190">• RPC router, 87 shapes</text>
      <text x="760" y="214">• file service</text>
      <text x="760" y="238">• editor and piece table</text>
      <text x="760" y="262">• terminal, tasks, search</text>
      <text x="760" y="286">• themes, plugins, settings</text>
    </g>

    <line x1="760" y1="306" x2="984" y2="306" stroke="#292e42" stroke-width="1"/>
    <g font-size="12.5" fill="#565f89">
      <text x="760" y="330">A feature Vrutti does not have yet</text>
      <text x="760" y="348">answers with a safe default,</text>
      <text x="760" y="366">so the extension keeps working.</text>
    </g>
  </g>

  <!-- ============ the pipe ============ -->
  <g>
    <rect x="318" y="130" width="52" height="234" rx="10" fill="#1b1d2e" stroke="url(#brand)" stroke-width="1.6"/>
    <g stroke="#565f89" stroke-width="1" opacity="0.6">
      <line x1="326" y1="150" x2="362" y2="150"/>
      <line x1="326" y1="166" x2="362" y2="166"/>
      <line x1="326" y1="182" x2="362" y2="182"/>
      <line x1="326" y1="198" x2="362" y2="198"/>
      <line x1="326" y1="214" x2="362" y2="214"/>
      <line x1="326" y1="230" x2="362" y2="230"/>
      <line x1="326" y1="246" x2="362" y2="246"/>
      <line x1="326" y1="262" x2="362" y2="262"/>
      <line x1="326" y1="278" x2="362" y2="278"/>
      <line x1="326" y1="294" x2="362" y2="294"/>
      <line x1="326" y1="310" x2="362" y2="310"/>
      <line x1="326" y1="326" x2="362" y2="326"/>
      <line x1="326" y1="342" x2="362" y2="342"/>
    </g>
  </g>
  <g stroke-width="2" fill="none">
    <path d="M 308 200 L 296 200 L 296 152 L 276 152" stroke="#7aa2f7" marker-end="url(#aBlue)"/>
    <path d="M 276 300 L 296 300 L 296 348 L 308 348" stroke="#f7768e" marker-end="url(#aPink)"/>
    <path d="M 652 200 L 664 200 L 664 152 L 684 152" stroke="#7aa2f7" marker-end="url(#aBlue)"/>
    <path d="M 684 300 L 664 300 L 664 348 L 652 348" stroke="#f7768e" marker-end="url(#aPink)"/>
  </g>
  <g font-size="11" fill="#565f89" text-anchor="middle">
    <text x="344" y="100">named pipe</text>
    <text x="344" y="392">one per window</text>
  </g>

  <!-- ============ request / reply legend ============ -->
  <g>
    <rect x="34" y="418" width="480" height="88" rx="12" fill="#1b1d2e" stroke="#292e42" stroke-width="1.5"/>
    <text x="56" y="446" fill="#c0caf5" font-size="14" font-weight="700">One request, one reply</text>
    <g font-size="12.5" fill="#a9b1d6">
      <circle cx="60" cy="470" r="4" fill="#7aa2f7"/>
      <text x="74" y="474">the extension calls the API — the host forwards the call</text>
      <circle cx="60" cy="492" r="4" fill="#f7768e"/>
      <text x="74" y="496">the core answers on the same pipe, in order</text>
    </g>
  </g>
  <g>
    <rect x="526" y="418" width="480" height="88" rx="12" fill="#1b1d2e" stroke="#292e42" stroke-width="1.5"/>
    <text x="548" y="446" fill="#c0caf5" font-size="14" font-weight="700">Never a dead end</text>
    <g font-size="12.5" fill="#a9b1d6">
      <text x="548" y="474">Every request has a deadline, so a silent peer cannot</text>
      <text x="548" y="492">hang an extension forever.</text>
    </g>
  </g>
</svg>
