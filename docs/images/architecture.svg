<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>Vrutti IDE architecture</title>
  <desc>The native C++ core, the IPC bridge, the Lit frontend and the Node.js extension host.</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b4261"/>
      <stop offset="45%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="brandFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23273b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f7768e"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1040" height="620" rx="18" fill="#16161e"/>
  <rect x="0.75" y="0.75" width="1038.5" height="618.5" rx="17.25" fill="none" stroke="#292e42" stroke-width="1.5"/>

  <!-- header -->
  <g>
    <rect x="34" y="26" width="34" height="34" rx="9" fill="url(#brand)"/>
    <path d="M51 32 L58 40 L51 48 L44 40 Z" fill="#16161e" opacity="0.85"/>
    <path d="M51 48 L51 55" stroke="#16161e" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <text x="80" y="50" fill="#c0caf5" font-size="21" font-weight="700">Vrutti IDE</text>
    <text x="196" y="50" fill="#565f89" font-size="15">architecture</text>
    <line x1="34" y1="78" x2="1006" y2="78" stroke="#292e42" stroke-width="1.5"/>
  </g>

  <!-- ============ top row: the three processes ============ -->

  <!-- Webview -->
  <g>
    <rect x="34" y="102" width="286" height="168" rx="14" fill="url(#brandFill)" stroke="#3b4261" stroke-width="1.5"/>
    <rect x="34" y="102" width="286" height="4" rx="2" fill="#7aa2f7"/>
    <text x="56" y="136" fill="#c0caf5" font-size="16" font-weight="700">Frontend</text>
    <text x="56" y="156" fill="#565f89" font-size="12" font-family="Consolas, monospace">src/ui/frontend</text>
    <g font-size="13.5" fill="#a9b1d6">
      <text x="56" y="186">• Lit web components</text>
      <text x="56" y="208">• Vite build</text>
      <text x="56" y="230">• TypeScript</text>
      <text x="56" y="252">• CodeMirror 6 editor</text>
    </g>
  </g>

  <!-- IPC bridge -->
  <g>
    <rect x="352" y="102" width="286" height="168" rx="14" fill="url(#brandFill)" stroke="#3b4261" stroke-width="1.5"/>
    <rect x="352" y="102" width="286" height="4" rx="2" fill="url(#brand)"/>
    <text x="374" y="136" fill="#c0caf5" font-size="16" font-weight="700">IPC bridge</text>
    <text x="374" y="156" fill="#565f89" font-size="12" font-family="Consolas, monospace">src/core/ipc</text>
    <g font-size="13.5" fill="#a9b1d6">
      <text x="374" y="186">• Named pipe, one per instance</text>
      <text x="374" y="208">• Newline-delimited JSON</text>
      <text x="374" y="230">• Request / reply / cancel</text>
      <text x="374" y="252">• Timeouts on every call</text>
    </g>
  </g>

  <!-- Extension host -->
  <g>
    <rect x="670" y="102" width="336" height="168" rx="14" fill="url(#brandFill)" stroke="#3b4261" stroke-width="1.5"/>
    <rect x="670" y="102" width="336" height="4" rx="2" fill="#f7768e"/>
    <text x="692" y="136" fill="#c0caf5" font-size="16" font-weight="700">Extension host</text>
    <text x="692" y="156" fill="#565f89" font-size="12" font-family="Consolas, monospace">src/ext/exthost</text>
    <g font-size="13.5" fill="#a9b1d6">
      <text x="692" y="186">• Node.js, one process</text>
      <text x="692" y="208">• The full extension API</text>
      <text x="692" y="230">• Bundled as a single ES module</text>
      <text x="692" y="252">• Extensions activate on demand</text>
    </g>
  </g>

  <!-- arrows between the three -->
  <g stroke-width="2" fill="none">
    <path d="M 324 168 L 346 168" stroke="#7aa2f7" marker-end="url(#arrow)"/>
    <path d="M 342 204 L 324 204" stroke="#7aa2f7" marker-end="url(#arrow)"/>
    <path d="M 642 168 L 664 168" stroke="#7aa2f7" marker-end="url(#arrow)"/>
    <path d="M 660 204 L 642 204" stroke="#f7768e" marker-end="url(#arrowPink)"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <rect x="313" y="178" width="44" height="17" rx="5" fill="#16161e" stroke="#292e42" stroke-width="1"/>
    <text x="335" y="190" fill="#7aa2f7">events</text>
    <rect x="631" y="178" width="44" height="17" rx="5" fill="#16161e" stroke="#292e42" stroke-width="1"/>
    <text x="653" y="190" fill="#7aa2f7">RPC</text>
  </g>

  <!-- ============ the native core ============ -->
  <g>
    <rect x="34" y="316" width="972" height="176" rx="16" fill="#1b1d2e" stroke="url(#brand)" stroke-width="2"/>
    <rect x="34" y="316" width="972" height="42" rx="16" fill="#23273b"/>
    <rect x="34" y="342" width="972" height="16" fill="#23273b"/>
    <text x="58" y="344" fill="#c0caf5" font-size="17" font-weight="700">Native C++ core</text>
    <text x="222" y="344" fill="#565f89" font-size="13" font-family="Consolas, monospace">src/core</text>
    <text x="982" y="344" fill="#565f89" font-size="12.5" text-anchor="end">one process · no runtime surprises</text>

    <!-- core modules -->
    <g font-size="13" fill="#c0caf5" text-anchor="middle">
      <g>
        <rect x="58" y="378" width="160" height="88" rx="10" fill="#1f2335" stroke="#3b4261" stroke-width="1.2"/>
        <text x="138" y="404" font-weight="700">RPC router</text>
        <text x="138" y="426" fill="#7aa2f7" font-size="12">87 actor shapes</text>
        <text x="138" y="446" fill="#565f89" font-size="11.5">benign defaults for</text>
        <text x="138" y="461" fill="#565f89" font-size="11.5">features we lack</text>
      </g>
      <g>
        <rect x="232" y="378" width="160" height="88" rx="10" fill="#1f2335" stroke="#3b4261" stroke-width="1.2"/>
        <text x="312" y="404" font-weight="700">File service</text>
        <text x="312" y="426" fill="#7dcfff" font-size="12">workspace.fs</text>
        <text x="312" y="446" fill="#565f89" font-size="11.5">stat · read · write</text>
        <text x="312" y="461" fill="#565f89" font-size="11.5">mkdir · rename · delete</text>
      </g>
      <g>
        <rect x="406" y="378" width="160" height="88" rx="10" fill="#1f2335" stroke="#3b4261" stroke-width="1.2"/>
        <text x="486" y="404" font-weight="700">Editor core</text>
        <text x="486" y="426" fill="#9ece6a" font-size="12">piece table</text>
        <text x="486" y="446" fill="#565f89" font-size="11.5">buffers, undo,</text>
        <text x="486" y="461" fill="#565f89" font-size="11.5">line scanning</text>
      </g>
      <g>
        <rect x="580" y="378" width="160" height="88" rx="10" fill="#1f2335" stroke="#3b4261" stroke-width="1.2"/>
        <text x="660" y="404" font-weight="700">Config</text>
        <text x="660" y="426" fill="#e0af68" font-size="12">settings · themes</text>
        <text x="660" y="446" fill="#565f89" font-size="11.5">JSON with comments,</text>
        <text x="660" y="461" fill="#565f89" font-size="11.5">atomic writes</text>
      </g>
      <g>
        <rect x="754" y="378" width="228" height="88" rx="10" fill="#1f2335" stroke="#3b4261" stroke-width="1.2"/>
        <text x="868" y="404" font-weight="700">Plugin host</text>
        <text x="868" y="426" fill="#bb9af7" font-size="12">native IPlugin DLLs</text>
        <text x="868" y="446" fill="#565f89" font-size="11.5">terminal · tasks · debug · search ·</text>
        <text x="868" y="461" fill="#565f89" font-size="11.5">themes · file system</text>
      </g>
    </g>
  </g>

  <!-- connectors from the core up to the three processes -->
  <g stroke-width="2" fill="none">
    <path d="M 177 316 L 177 276" stroke="#7aa2f7" marker-end="url(#arrow)"/>
    <path d="M 495 316 L 495 276" stroke="#7aa2f7" marker-end="url(#arrow)"/>
    <path d="M 838 316 L 838 276" stroke="#f7768e" marker-end="url(#arrowPink)"/>
  </g>

  <!-- ============ the promise ============ -->
  <g>
    <rect x="34" y="524" width="972" height="66" rx="14" fill="#1b1d2e" stroke="#292e42" stroke-width="1.5"/>
    <circle cx="72" cy="557" r="17" fill="none" stroke="url(#brand)" stroke-width="2.4"/>
    <path d="M 65 557 L 70 562 L 80 551" fill="none" stroke="#9ece6a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="551" fill="#c0caf5" font-size="14.5" font-weight="700">The promise we build on</text>
    <text x="104" y="573" fill="#a9b1d6" font-size="13.5">An extension that works in the reference editor works in Vrutti — same API, same behaviour, no stubs.</text>
  </g>
</svg>
