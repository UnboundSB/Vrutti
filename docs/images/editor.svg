  <g clip-path="url(#codeClip)" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12.5">
    <text x="300" y="132" fill="#565f89">// The native core and the extension host, one pipe.</text>
    <text x="300" y="150"><tspan fill="#bb9af7">import</tspan><tspan fill="#c0caf5"> { </tspan><tspan fill="#7aa2f7">createRequire</tspan><tspan fill="#c0caf5"> } </tspan><tspan fill="#bb9af7">from</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#9ece6a">'node:module'</tspan><tspan fill="#c0caf5">;</tspan></text>
    <text x="300" y="186"><tspan fill="#bb9af7">export class</tspan><tspan fill="#7aa2f7"> VruttiBridge</tspan><tspan fill="#c0caf5"> {</tspan></text>
    <text x="300" y="204"><tspan fill="#bb9af7">  private</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#c0caf5">pending</tspan><tspan fill="#c0caf5"> = </tspan><tspan fill="#bb9af7">new</tspan><tspan fill="#7aa2f7"> Map</tspan><tspan fill="#89ddff">&lt;</tspan><tspan fill="#e0af68">number</tspan><tspan fill="#89ddff">,</tspan><tspan fill="#e0af68"> Reply</tspan><tspan fill="#89ddff">&gt;</tspan><tspan fill="#c0caf5">();</tspan></text>
    <text x="300" y="258"><tspan fill="#bb9af7">  async</tspan><tspan fill="#7aa2f7"> request</tspan><tspan fill="#c0caf5">(</tspan><tspan fill="#c0caf5">method</tspan><tspan fill="#89ddff">:</tspan><tspan fill="#e0af68"> string</tspan><tspan fill="#89ddff">,</tspan><tspan fill="#c0caf5">args</tspan><tspan fill="#89ddff">:</tspan><tspan fill="#e0af68"> unknown</tspan><tspan fill="#89ddff">[]</tspan><tspan fill="#c0caf5">) {</tspan></text>
    <text x="300" y="276"><tspan fill="#bb9af7">    const</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#c0caf5">id</tspan><tspan fill="#89ddff"> = </tspan><tspan fill="#c0caf5">this</tspan><tspan fill="#89ddff">.</tspan><tspan fill="#c0caf5">nextId</tspan><tspan fill="#c0caf5">++;</tspan></text>
    <text x="300" y="312"><tspan fill="#c0caf5">    </tspan><tspan fill="#c0caf5">this</tspan><tspan fill="#89ddff">.</tspan><tspan fill="#7aa2f7">write</tspan><tspan fill="#c0caf5">({ </tspan><tspan fill="#c0caf5">type</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#9ece6a">'request'</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c0caf5">reqId</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#c0caf5">id</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c0caf5">method</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c0caf5">args</tspan><tspan fill="#c0caf5"> });</tspan></text>
    <text x="300" y="330"><tspan fill="#bb9af7">    return</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#c0caf5">this</tspan><tspan fill="#89ddff">.</tspan><tspan fill="#c0caf5">pending</tspan><tspan fill="#89ddff">.</tspan><tspan fill="#7aa2f7">get</tspan><tspan fill="#c0caf5">(</tspan><tspan fill="#c0caf5">id</tspan><tspan fill="#c0caf5">);</tspan></text>
    <text x="300" y="348" fill="#c0caf5">  }</text>
    <text x="300" y="366" fill="#c0caf5">}</text>
  </g>
